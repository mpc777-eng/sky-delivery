<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sky Delivery</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky Delivery">
<meta name="theme-color" content="#4fb0ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#4fb0ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#4fb0ff 0%,#bfe9ff 62%,#7ccc5a 62%,#5fb544 100%);font-family:"Chalkboard SE","Comic Sans MS","Comic Neue",system-ui,sans-serif;z-index:5}
  #start h1{font-size:10vmin;margin:0 0 1vmin;color:#fff;text-align:center;text-shadow:0 .6vmin 0 #2a6aa8}
  #start p{font-size:4.2vmin;margin:0;color:#fff;text-shadow:0 .4vmin 0 #2a6aa8;text-align:center}
  #start .big{font-size:20vmin;line-height:1.1}
  #play{margin-top:4vmin;font-size:8vmin;padding:2vmin 8vmin;border:none;border-radius:6vmin;background:#ffcc33;color:#5a3a00;box-shadow:0 1.2vmin 0 #c99400;font-family:inherit}
  #shop{margin-top:3vmin;font-size:5vmin;padding:1.5vmin 6vmin;border:none;border-radius:5vmin;background:#7be06b;color:#1d4d12;box-shadow:0 1vmin 0 #4a9e3c;font-family:inherit}
  #startCoins{margin-top:2vmin!important;font-size:4.5vmin!important}
  #play:active{transform:translateY(1vmin);box-shadow:0 .2vmin 0 #c99400}
</style>
</head>
<body>
<div id="start">
  <div class="big">✈️📦</div>
  <h1>Sky Delivery</h1>
  <p>Fly packages from airport to airport!</p>
  <button id="play">▶ Play</button>
  <button id="shop">🛒 Plane Shop</button>
  <p id="startCoins"></p>
</div>
<canvas id="c"></canvas>
<script>
"use strict";
// ================= Tuning =================
const FAST = /[?&]fast=1/.test(location.search);   // ?fast=1 makes short legs for testing
const LEG_SECONDS = FAST ? 25 : 180; // how long an airport-to-airport trip takes at normal cruise speed
const CRUISE = 300, BOOST = 360;     // flying speeds (GO FAST = BOOST)
const LEG = Math.round((LEG_SECONDS - 6) * CRUISE + 1800); // distance between airports (takeoff/landing are slower)
const SEG = LEG / 3;                 // scenery changes 3 times per trip
const FUEL_RATE = 100 / (LEG_SECONDS * 1.6); // a full tank lasts ~1.6 trips at cruise
const CHEER_SEC = 45;                // seconds between encouraging voice lines
const RUNWAY = 1100;       // runway length
const TAKEOFF_V = 210;     // speed needed to take off
const MAXALT = 1500;       // highest the plane can fly
const STAR3 = -95, STAR2 = -165, CRASH_VY = -245;  // touchdown descent speeds
// ==========================================
const W = 1024, H = 768, BASE = 640;
const FONT = '"Chalkboard SE","Comic Sans MS","Comic Neue",system-ui,sans-serif';
const NAMES = ["Home Field", "Sunny Beach", "Snowy Peak", "Cactus Town", "Maple City", "Coral Bay", "Pine Ridge", "Sandy Rock"];
const BIOMES = ["city", "ocean", "mountains", "desert"];
const CARGO = [["📦", "packages"], ["🍕", "pizzas"], ["🧸", "teddy bears"], ["✉️", "letters"], ["🎁", "presents"], ["🍦", "ice cream"]];
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
}
addEventListener("resize", resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- sound and voice ----------
let ac = null, noiseBuf = null, engOsc = null, engGain = null, windGain = null;
function initAudio() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    engOsc = ac.createOscillator(); engOsc.type = "sawtooth"; engOsc.frequency.value = 70;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380;
    engGain = ac.createGain(); engGain.gain.value = 0;
    engOsc.connect(lp).connect(engGain).connect(ac.destination); engOsc.start();
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 700; bp.Q.value = 0.5;
    windGain = ac.createGain(); windGain.gain.value = 0;
    src.connect(bp).connect(windGain).connect(ac.destination); src.start();
  } catch (e) { ac = null; }
}
function tone(freq, dur, type = "sine", vol = 0.25, slide = 0, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, type, freq, delay = 0, freqEnd = 0) {
  if (!ac || !noiseBuf) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  ring: () => { [784, 988, 1319].forEach((f, i) => tone(f, 0.18, "triangle", 0.18, 0, i * 0.07)); },
  coin: () => { tone(988, 0.07, "square", 0.08); tone(1319, 0.15, "square", 0.08, 0, 0.07); },
  fuel: () => { for (let i = 0; i < 4; i++) tone(300 + i * 90, 0.1, "sine", 0.2, 0, i * 0.08); },
  bonk: () => { tone(500, 0.18, "triangle", 0.25, -250); noise(0.15, 0.2, "bandpass", 900); },
  gear: () => { tone(180, 0.8, "sawtooth", 0.05, 120); tone(600, 0.1, "square", 0.05, 0, 0.8); },
  squeak: () => { noise(0.12, 0.25, "highpass", 2500); noise(0.12, 0.2, "highpass", 2500, 0.15); },
  crash: () => { noise(1.4, 0.6, "lowpass", 900, 0, 90); tone(120, 0.6, "triangle", 0.3, -70); for (let j = 0; j < 6; j++) tone(rnd(400, 1200), 0.06, "square", 0.05, 0, 0.05 + j * 0.08); },
  splash: () => { noise(1.0, 0.5, "bandpass", 1200, 0, 300); },
  yay: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.26, "triangle", 0.2, 0, i * 0.12)); },
  nope: () => { tone(300, 0.14, "square", 0.07); tone(230, 0.2, "square", 0.07, 0, 0.15); },
  whoosh: () => noise(0.6, 0.2, "bandpass", 400, 0, 1400),
  star: (i) => tone(660 + i * 220, 0.25, "triangle", 0.22, 0, i * 0.25),
};
let lastSay = "", message = "", lastSayTime = 0;
function setMsg(t) { message = t; }
function say(text) {
  lastSay = text; message = text; lastSayTime = time;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[^\w\s!?,.']/g, ""));
    u.lang = "en-US"; u.rate = 0.95; u.pitch = 1.1;
    const v = speechSynthesis.getVoices().find(v => /Samantha|Karen|Moira|Tessa|Google US English/.test(v.name));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- world ----------
const legOf = x => Math.floor(x / LEG);
const biomeOfLeg = L => BIOMES[((L % 4) + 4) % 4];
const segOf = x => Math.floor(x / SEG);
const biomeAt = x => biomeOfLeg(segOf(x));
const airportName = k => NAMES[((k % NAMES.length) + NAMES.length) % NAMES.length];
function groundH(x) {
  const L = legOf(x), u = x - L * LEG, b = biomeAt(x), s = x - segOf(x) * SEG;
  if (u < 1500 || u > LEG - 1800) return 0;
  const e = clamp(Math.min(1, (u - 1500) / 600, (LEG - 1800 - u) / 600, s / 700, (SEG - s) / 700), 0, 1);
  if (b === "mountains") return e * Math.max(0, 170 + 140 * Math.sin(u / 420) + 80 * Math.sin(u / 170 + 1));
  if (b === "desert") return e * (30 + 22 * Math.sin(u / 260));
  if (b === "city") return e * (8 + 8 * Math.sin(u / 300));
  return 0;
}
function isWater(x) { const L = legOf(x), u = x - L * LEG, s = x - segOf(x) * SEG; return biomeAt(x) === "ocean" && u > 1700 && u < LEG - 2000 && s > 400 && s < SEG - 400; }
function runwayAt(x) { const k = legOf(x), u = x - k * LEG; return u >= 0 && u <= RUNWAY ? k : null; }

const legCache = new Map();
function legData(L) {
  if (legCache.has(L)) return legCache.get(L);
  let seed = L * 9301 + 49297; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const base = L * LEG, d = { rings: [], coins: [], balloons: [], fuel: [], clouds: [], birds: [], boats: [], whales: [] };
  const top = (x, w = 300) => { let m = 0; for (let k = -w; k <= w; k += 50) m = Math.max(m, groundH(x + k)); return m; };
  for (let u = 2300; u < LEG - 2600; u += 900 + r() * 400) { const x = base + u; d.rings.push({ x, alt: top(x) + 170 + r() * 300, got: false }); }
  for (let u = 2600; u < LEG - 3000; u += 2400 + r() * 1200) {
    const x0 = base + u, h0 = top(x0, 500) + 150 + r() * 250;
    for (let i = 0; i < 5; i++) d.coins.push({ x: x0 + i * 60, alt: h0 + Math.sin(i / 4 * Math.PI) * 70, got: false });
  }
  for (let u = 3000; u < LEG - 3000; u += 4200 + r() * 1800) { const x = base + u; d.balloons.push({ x, alt: top(x) + 300 + r() * 350, ph: r() * 6, c: Math.floor(r() * 4) }); }
  for (const f of LEG > 20000 ? [0.33, 0.68] : [0.5]) { const x = base + LEG * f + 300; d.fuel.push({ x, alt: top(x) + 200 + r() * 150, got: false }); }
  for (let u = 900; u < LEG; u += 450 + r() * 350) d.clouds.push({ x: base + u, alt: 260 + r() * 800, s: 0.8 + r() * 0.7 });
  for (let u = 3800; u < LEG - 3000; u += 3800 + r() * 1600) { const x = base + u; d.birds.push({ x, alt: top(x) + 200 + r() * 300, n: 3 + Math.floor(r() * 3), ph: r() * 6, hit: -99 }); }
  for (let u = 1800; u < LEG - 2000; u += 650 + r() * 450) if (isWater(base + u)) d.boats.push({ x: base + u, c: Math.floor(r() * 3) });
  for (let u = 2100; u < LEG - 2000; u += 1700 + r() * 900) if (isWater(base + u) && isWater(base + u - 150) && isWater(base + u + 150)) d.whales.push({ x: base + u, ph: r() * 6 });
  { const x = base + Math.round(LEG * 0.5) - 900; d.rainbow = { x, base: top(x, 450), r: 420, got: false }; }
  legCache.set(L, d);
  return d;
}

// ---------- state ----------
let state = "start", time = 0, totalStars = 0, crashCount = 0;
// ---------- plane skins + saved progress ----------
const SKINS = [
  { id: "classic", name: "Classic Red", price: 0, body: "#ff4757", stripe: "#ffffff", wing: "#f4f4f4", tail: "#ff4757", nose: "#ffd23f" },
  { id: "sky", name: "Sky Blue", price: 60, body: "#4fb0ff", stripe: "#ffffff", wing: "#e8f6ff", tail: "#2a7fd4", nose: "#ffffff" },
  { id: "candy", name: "Candy", price: 100, body: "#ff9cd2", stripe: "#ffffff", wing: "#fff0f8", tail: "#ff5fa8", nose: "#7be0ff", fx: "candy" },
  { id: "tiger", name: "Tiger", price: 150, body: "#ff9f1c", stripe: "#ffffff", wing: "#ffe1b0", tail: "#ff9f1c", nose: "#333333", fx: "tiger" },
  { id: "police", name: "Police", price: 200, body: "#2f5fd0", stripe: "#ffffff", wing: "#ffffff", tail: "#1d3f99", nose: "#ffffff", fx: "police" },
  { id: "fire", name: "Fire Rescue", price: 250, body: "#e63946", stripe: "#ffd23f", wing: "#ffd23f", tail: "#c1121f", nose: "#ffffff", fx: "fire" },
  { id: "shark", name: "Shark", price: 300, body: "#7d8fa3", stripe: "#ffffff", wing: "#9fb0c2", tail: "#6a7b8f", nose: "#7d8fa3", fx: "shark" },
  { id: "rainbow", name: "Rainbow", price: 400, body: "#ff5e5e", stripe: "#ffffff", wing: "#ffffff", tail: "#7b5cff", nose: "#ffd23f", fx: "rainbow" },
  { id: "galaxy", name: "Galaxy", price: 550, body: "#2b1b5a", stripe: "#b98cff", wing: "#3d2a7a", tail: "#1b1040", nose: "#ff7bd5", fx: "galaxy" },
  { id: "gold", name: "Golden", price: 750, body: "#f5c518", stripe: "#fff3b0", wing: "#ffe066", tail: "#d4a017", nose: "#ffffff", fx: "gold" },
];
// plane models: sizes, handling, and how many coins they earn per landing
const MODELS = [
  { id: "zipper", name: "Tiny Zipper", price: 80, sc: 0.85, L: 48, R: 14, win: 1, wing: 26, gear: [-6, 16], strut: 16, wr: 7, prop: true, eng: 0,
    spd: 1.15, acc: 1.3, climb: 1.2, turn: 1.5, tv: 190, coin: 1, gentle: 1.1, brake: 1.2, about: "Small and zippy!" },
  { id: "classic", name: "Classic", price: 0, sc: 1, L: 66, R: 19, win: 4, wing: 36, gear: [-12, 26], strut: 22, wr: 8, prop: true, eng: 0,
    spd: 1, acc: 1, climb: 1, turn: 1, tv: 210, coin: 1, gentle: 1, brake: 1, about: "Easy to fly." },
  { id: "airliner", name: "Long Airliner", price: 300, sc: 1, L: 112, R: 19, win: 12, wing: 46, gear: [-34, 56], strut: 22, wr: 8, prop: false, eng: 1,
    spd: 0.95, acc: 0.85, climb: 0.85, turn: 0.75, tv: 225, coin: 1.5, gentle: 0.95, brake: 0.85, about: "Carries more cargo!" },
  { id: "jumbo", name: "Big Jumbo Jet", price: 700, sc: 1.15, L: 120, R: 25, win: 14, deck: true, wing: 58, gear: [-46, -20, 60], strut: 24, wr: 10, prop: false, eng: 2,
    spd: 0.9, acc: 0.7, climb: 0.72, turn: 0.6, tv: 240, coin: 2, gentle: 0.85, brake: 0.65, about: "Huge! Land extra gently." },
];
for (const m of MODELS) m.cy = (m.R * 0.5 + m.strut + m.wr) * m.sc;   // height of the body center above the wheels
const LANDING_COINS = [0, 10, 20, 30];
const SAVE_KEY = "skyDelivery.save.v1";
let coins = 0, owned = ["classic"], equipped = "classic", ownedModels = ["classic"], model = "classic", saveDirty = false, saveT = 0;
try {
  const sv = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
  if (sv) {
    coins = Math.max(0, sv.coins | 0); totalStars = Math.max(0, sv.stars | 0);
    if (Array.isArray(sv.owned)) owned = sv.owned.filter(id => SKINS.some(k => k.id === id));
    if (!owned.includes("classic")) owned.unshift("classic");
    equipped = owned.includes(sv.equipped) ? sv.equipped : "classic";
    if (Array.isArray(sv.models)) ownedModels = sv.models.filter(id => MODELS.some(k => k.id === id));
    if (!ownedModels.includes("classic")) ownedModels.unshift("classic");
    model = ownedModels.includes(sv.model) ? sv.model : "classic";
  }
} catch (e) {}
function save() { saveDirty = false; try { localStorage.setItem(SAVE_KEY, JSON.stringify({ coins, owned, equipped, models: ownedModels, model, stars: totalStars })); } catch (e) {} }
const skin = () => SKINS.find(k => k.id === equipped) || SKINS[0];
const mdl = () => MODELS.find(k => k.id === model) || MODELS[1];
const plane = { x: 150, alt: 0, vx: 0, vy: 0, ground: true, gear: 1, gearT: 1, prop: 0, shake: 0, justLanded: false, stars: 0, saidFast: false };
let fuel = 100, fuelWarned = false, fuelEmpty = false;
let mission = { origin: 0, dest: 1, cargo: 0, n: 3 };
let camX = plane.x - 300, camAlt = 0;
let particles = [], pieces = [], floaters = [], starPop = null;
let crashWater = false, crashT = 0, deliverT = 0, mist = 0, inCloud = false;
const said = new Set();
const CHEERS = ["Great flying!", "You are doing awesome, pilot!", "Look for gold rings and coins!", "Wow, what a view!", "Your cargo is safe and happy!", "Keep it up, captain!"];
function sayOnce(key, text) { if (said.has(key)) return; said.add(key); say(text); }
const keys = { up: false, down: false, go: false };
const held = new Map();
let tiltOn = false, tiltVal = 0, tiltZero = null;

function missionText() { const c = CARGO[mission.cargo]; return `Fly the ${c[1]} to ${airportName(mission.dest)}!`; }
function newMission(k) {
  mission = { origin: k, dest: k + 1, cargo: (mission.cargo + 1) % CARGO.length, n: 3 + Math.floor(Math.random() * 3) };
}
function parkAt(k) {
  Object.assign(plane, { x: k * LEG + 150, alt: 0, vx: 0, vy: 0, ground: true, gear: 1, gearT: 1, justLanded: false, shake: 0, saidFast: false });
  fuel = 100; fuelWarned = false; fuelEmpty = false;
  camX = plane.x - 300; camAlt = 0;
}

// ---------- particles ----------
function addP(p) { if (particles.length < 260) particles.push(p); }
function burst(x, alt, n = 18, colors = ["#ffd23f", "#ff6b9a", "#5ad1ff", "#7be06b", "#ffffff"]) {
  for (let i = 0; i < n; i++) addP({ x, alt, vx: rnd(-260, 260), va: rnd(100, 520), g: -900, life: rnd(1.2, 1.8), c: colors[i % colors.length], r: rnd(5, 11) });
}
function floater(text, x, alt, color) { floaters.push({ text, x, alt, color, life: 1.4 }); }

// ---------- actions ----------
function toggleGear() {
  if (state !== "play") return;
  if (plane.ground) { sfx.nope(); say("The wheels stay down on the ground!"); return; }
  plane.gearT = plane.gearT ? 0 : 1; sfx.gear();
  if (plane.gearT === 0) { if (!said.has("wheelsUp")) sayOnce("wheelsUp", `Wheels up! Follow the map to ${airportName(mission.dest)}.`); else setMsg("Wheels up! 🛞⬆️"); }
  else setMsg("Wheels down! 🛞⬇️");
}
function crash(why) {
  if (state !== "play") return;
  state = "crash"; crashT = 3.2; crashCount++;
  const water = isWater(plane.x); crashWater = water;
  water ? sfx.splash() : sfx.crash();
  const cx = plane.x, ca = Math.max(plane.alt, groundH(plane.x)) + 30;
  const sk = skin(), m = mdl(), z = m.sc;
  const parts = [];
  for (let i = 0; i < Math.ceil(m.L / 30); i++) parts.push([i % 2 ? sk.stripe : sk.body, 34 * z, m.R * 1.6 * z]);
  parts.push([sk.wing, m.wing * 1.1 * z, 9 * z], [sk.wing, m.wing * 0.9 * z, 8 * z], [sk.tail, 20 * z, (m.R + 4) * z], [sk.nose, 12 * z, 12 * z]);
  for (let i = 0; i < Math.min(4, Math.ceil(m.win / 3)); i++) parts.push(["#9fd8ff", 10 * z, 8 * z]);
  if (m.prop) parts.push(["#555", 6, 28 * z]);
  for (let i = 0; i < m.eng * 2; i++) parts.push(["#b8c0cc", 26 * z, 12 * z]);
  if (plane.gear > 0.3) for (const g of m.gear) parts.push(["#222", m.wr * 1.1 * z, m.wr * 1.1 * z, true]);
  pieces = parts.map(([c, w, h, round]) => ({ x: cx + rnd(-30, 30), alt: ca + rnd(-10, 20), vx: plane.vx * 0.5 + rnd(-220, 220), va: rnd(200, 520), rot: rnd(0, 6), vr: rnd(-8, 8), c, w, h, round }));
  for (let i = 0; i < 16; i++) addP({ x: cx + rnd(-30, 30), alt: ca, vx: rnd(-120, 120), va: rnd(40, 160), g: water ? -500 : 60, life: rnd(1, 2), c: water ? "#cfeaff" : ["#ff7b00", "#ffb000", "#ff4500"][i % 3], r: rnd(10, 22), fire: !water });
  plane.vx = 0; mist = 0;
  say(why + " Let's try again!");
}
function landed(stars) {
  plane.ground = true; plane.alt = 0; plane.vy = 0; plane.justLanded = true; plane.stars = stars;
  sfx.squeak(); starPop = { n: stars, t: 0 };
  for (let i = 0; i < stars; i++) sfx.star(i);
  for (let i = 0; i < 8; i++) addP({ x: plane.x + rnd(-30, 20), alt: 5, vx: rnd(-80, 30), va: rnd(30, 90), g: 50, life: 0.8, c: "rgba(230,230,230,0.7)", r: rnd(8, 14) });
  const got = Math.round(LANDING_COINS[stars] * mdl().coin); coins += got; save();
  floater("+" + got + " 🪙", plane.x, 170, "#ffd23f");
  const words = ["", "One star! Good job!", "Two stars! Nice landing!", "Great landing! Three stars!"];
  say(words[stars] + ` You got ${got} coins!`);
}
function arrive(k) {
  if (k !== mission.dest) return;
  state = "deliver"; deliverT = 4.5;
  totalStars += plane.stars; save();
  sfx.yay(); burst(plane.x, 120, 40);

      if (p) addP({ x: p.x + rnd(-8, 8), alt: p.alt + 6, vx: rnd(-20, 20), va: rnd(40, 90), g: -30, life: 1.4, c: crashWater ? "rgba(220,240,255,0.7)" : Math.random() < 0.5 ? "rgba(90,90,100,0.55)" : "rgba(255,140,0,0.8)", r: rnd(8, 16), fire: true });

    const g = isWater(p.x) ? -6 : groundH(p.x);

}

function updatePlane(dt) {
  const go = (keys.go || holding("go")) && fuel > 0;

  const destX = mission.dest * LEG, m = mdl(), TV = m.tv;
  if (plane.ground) {

    plane.x += plane.vx * dt;
    const k = legOf(plane.x), end = k * LEG + RUNWAY;
    if (!plane.justLanded && plane.vx >= TV && !plane.saidFast) { plane.saidFast = true; say("Fast enough! Press UP to take off!"); }
    if (!plane.justLanded && ctrl > 0 && plane.vx < TV && plane.vx > 5) setMsg("Faster! Keep holding GO 🚀");
    if (!plane.justLanded && plane.x > end - 30 && plane.vx >= TV * 0.9) ctrl = 1; // runway ends: hop up
    if (plane.x > end) { plane.x = end; if (plane.vx > 0) { plane.vx = 0; sfx.bonk(); setMsg("End of the runway!"); } }

  if (u > 1300 && sOff > 1000 && sOff < 3000 && u < LEG - 3000) sayOnce("biome" + S, { city: "Look at the big city!", ocean: "Look, the ocean! Can you see the whales?", mountains: "Mountains ahead! Fly up high!", desert: "Welcome to the desert! The sun is setting." }[b]);

  if (prog > 0.84 && dist > 2700) sayOnce("almost" + tag, "Almost there! Get ready to land soon.");
  else if (prog > 0.5 && prog < 0.84 && !said.has("half" + tag)) sayOnce("half" + tag, "Halfway there! Keep going, pilot!");
  else if (prog > 0.06 && prog < 0.8 && time - lastSayTime > CHEER_SEC) say(CHEERS[Math.floor(Math.random() * CHEERS.length)]);
  const rb = legData(L).rainbow;
  if (rb && !rb.got && rb.x - plane.x < 1600 && rb.x > plane.x) sayOnce("rbw" + L + "_" + crashCount, "A rainbow! Fly under the rainbow for bonus coins!");
  if (dist < 2700 && dist > 0) sayOnce("near" + mission.dest + "_" + mission.origin + crashCount, `${airportName(mission.dest)} is ahead! Fly down low and follow the dots.`);

  }

    }
  }

}

  text(down ? "GEAR ⬇" : "GEAR ⬆", g.x, g.y + 30, 17, "#fff");
  const o = BTN.go, p = holding("go") || keys.go;
  circle(o.x, o.y + 6, o.r, "rgba(0,0,0,0.25)"); circle(o.x, o.y + (p ? 4 : 0), o.r, p ? "#e0841a" : "#ff9f1c");
  emoji("🚀", o.x, o.y - 12 + (p ? 4 : 0), 46); text("GO FAST", o.x, o.y + 36 + (p ? 4 : 0), 18, "#fff");
}
const SHOPBTN = { x: W / 2 - 115, y: 650, w: 230, h: 84 };
const canShop = () => state === "play" && plane.ground && plane.vx === 0;
function drawHud() {
  panel(16, 16, 256, 100);
  text("⭐ " + totalStars, 30, 44, 30, "#3a2a10", "left");
  text("🪙 " + coins, 258, 44, 30, "#3a2a10", "right");
  text("⛽", 34, 86, 26, "#000");
  panel(58, 74, 200, 24, "#d9dde3", 12);
  panel(58, 74, Math.max(24, 200 * fuel / 100), 24, fuel > 50 ? "#56d356" : fuel > 25 ? "#ffd23f" : (Math.sin(time * 8) > 0 ? "#ff5a5a" : "#ff9a9a"), 12);
  const c = CARGO[mission.cargo];
  panel(16, 124, 256, 50);
  emoji(c[0], 44, 149, 30); text("→ " + airportName(mission.dest), 66, 150, 22, "#1d3f6e", "left", null, 200);
  // mini map
  const ox = mission.origin * LEG, dx = mission.dest * LEG, f = clamp((plane.x - ox) / (dx - ox), 0, 1);
  panel(290, 16, 444, 78, "rgba(20,40,70,0.7)", 20);
  ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 4; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.moveTo(330, 70); ctx.lineTo(694, 70); ctx.stroke(); ctx.setLineDash([]);
  emoji("🛫", 318, 70, 28); emoji("🛬", 708, 70, 28);
  const sp = plane.ground ? CRUISE * mdl().spd : Math.max(150, plane.vx), secs = Math.max(0, Math.ceil((dx - plane.x) / sp));
  const tl = secs >= 60 ? Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") : secs + " sec";
  text(secs > 0 ? `${airportName(mission.dest)}  ⏱ ${tl} to go` : airportName(mission.dest), 512, 36, 22, "#fff", "center", null, 420);
  emoji("✈️", 330 + f * 364, 66, 30);
  // top right buttons
  circle(BTN.speaker.x, BTN.speaker.y, BTN.speaker.r, "rgba(255,255,255,0.9)"); emoji("🔊", BTN.speaker.x, BTN.speaker.y + 2, 32);
  circle(BTN.tilt.x, BTN.tilt.y, BTN.tilt.r, tiltOn ? "#56d356" : "rgba(255,255,255,0.9)"); emoji("📱", BTN.tilt.x, BTN.tilt.y - 6, 26); text(tiltOn ? "TILT ON" : "TILT", BTN.tilt.x, BTN.tilt.y + 20, 11, "#1d3f6e");
  if (message && state !== "deliver") {
    ctx.font = `bold 28px ${FONT}`; const w = Math.min(W - 60, ctx.measureText(message).width + 60);
    panel(W / 2 - w / 2, 214, w, 54, "rgba(255,255,255,0.92)", 27); text(message, W / 2, 242, 28, "#2a2410", "center", null, W - 100);
  }
  drawButtons();
  const dist = mission.dest * LEG - plane.x;
  if (state === "play" && !plane.ground && dist < 2700 && dist > -RUNWAY) {
    const m = mdl(), k = m.climb * m.gentle;
    const ok = [plane.gear >= 0.98, plane.vx <= 280 * m.spd, plane.vy > STAR2 * k];
    panel(262, 678, 500, 62, "rgba(20,40,70,0.75)", 24);
    ["🛞 Gear down", "🐢 Slow", "🪶 Gentle"].forEach((s, i) => text((ok[i] ? "✅ " : "❌ ") + s, 345 + i * 168, 709, 21, "#fff", "center", null, 160));
  } else if (canShop()) {
    panel(SHOPBTN.x, SHOPBTN.y + 6, SHOPBTN.w, SHOPBTN.h, "rgba(0,0,0,0.25)", 30);
    panel(SHOPBTN.x, SHOPBTN.y, SHOPBTN.w, SHOPBTN.h, "#7be06b", 30); text("🛒 SHOP", W / 2, SHOPBTN.y + 42, 34, "#1d4d12");
  }
  for (const fl of floaters) { ctx.globalAlpha = Math.min(1, fl.life); text(fl.text, sx(fl.x), sy(fl.alt), 36, fl.color, "center", "#1d2a3a"); }
  ctx.globalAlpha = 1;
  if (starPop) {
    const t = starPop.t;
    panel(W / 2 - 170, 290, 340, 110, "rgba(255,255,255,0.9)", 30);
    for (let i = 0; i < 3; i++) { const s = clamp((t - i * 0.25) * 4, 0, 1); ctx.globalAlpha = i < starPop.n ? 1 : 0.25; emoji("⭐", W / 2 - 100 + i * 100, 345, 70 * (i < starPop.n ? s : 1)); }
    ctx.globalAlpha = 1;
  }
  if (state === "deliver") {
    panel(W / 2 - 280, 420, 560, 120, "rgba(255,255,255,0.94)", 34);
    text("🎉 Delivered! 🎉", W / 2, 462, 46, "#e2572b");
    text(`${c[0]} ${c[1]} → ${airportName(mission.dest)}`, W / 2, 510, 26, "#3a2a10");
  }
}

// ---------- shop ----------
let shopTab = "planes", shopFrom = "start", shopMsg = "";
const SHOP_CLOSE = { x: W - 60, y: 52, r: 40 };
const TABS = { planes: { x: 300, y: 92, w: 200, h: 56 }, skins: { x: 524, y: 92, w: 200, h: 56 } };
function shopCards() {
  const list = shopTab === "planes" ? MODELS : SKINS, cols = shopTab === "planes" ? 2 : 5;
  const cw = shopTab === "planes" ? 470 : 184, ch = shopTab === "planes" ? 268 : 270, gap = shopTab === "planes" ? 20 : 12;
  const x0 = (W - (cols * cw + (cols - 1) * gap)) / 2;
  return list.map((it, i) => ({ it, x: x0 + (i % cols) * (cw + gap), y: 166 + Math.floor(i / cols) * (ch + 14), w: cw, h: ch }));
}
function openShop(from) { shopFrom = from; state = "shop"; shopMsg = ""; held.clear(); keys.up = keys.down = keys.go = false; say("Welcome to the plane shop! Tap a plane to buy it or fly it."); }
function closeShop() {
  if (shopFrom === "start") { state = "start"; showStart(); } else { state = "play"; say(`Ready to fly! ${missionText()}`); }
}
function shopTap(p) {
  if (Math.hypot(p.x - SHOP_CLOSE.x, p.y - SHOP_CLOSE.y) < SHOP_CLOSE.r + 12) { closeShop(); return; }
  for (const t in TABS) { const b = TABS[t]; if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) { shopTab = t; sfx.coin(); return; } }
  for (const c of shopCards()) {
    if (p.x < c.x || p.x > c.x + c.w || p.y < c.y || p.y > c.y + c.h) continue;
    const isPlane = shopTab === "planes", ownList = isPlane ? ownedModels : owned, it = c.it;
    if (ownList.includes(it.id)) {
      if (isPlane) model = it.id; else equipped = it.id;
      save(); sfx.coin(); say(`Ready to fly the ${isPlane ? it.name : it.name + " plane"}!`);
    } else if (coins >= it.price) {
      coins -= it.price; ownList.push(it.id); if (isPlane) model = it.id; else equipped = it.id;
      save(); sfx.yay(); burst(camX + c.x + c.w / 2, camAlt + BASE - c.y - 80, 30);
      say(`New plane! You got the ${it.name}!`);
    } else {
      sfx.nope(); shopMsg = `You need ${it.price - coins} more coins`;
      say("Not enough coins yet, keep flying!");
    }
    return;
  }
}
function drawShop() {
  ctx.fillStyle = "rgba(15,30,60,0.75)"; ctx.fillRect(-600, -600, W + 1200, H + 1200);
  panel(16, 12, W - 32, H - 24, "#eaf6ff", 30);
  text("🛒 Plane Shop", 40, 52, 40, "#1d3f6e", "left");
  panel(W - 290, 26, 170, 52, "#fff3c4", 24); text("🪙 " + coins, W - 205, 53, 32, "#7a5200");
  circle(SHOP_CLOSE.x, SHOP_CLOSE.y, SHOP_CLOSE.r, "#ff6b6b"); text("✕", SHOP_CLOSE.x, SHOP_CLOSE.y + 2, 40, "#fff");
  for (const t in TABS) { const b = TABS[t], on = shopTab === t; panel(b.x, b.y, b.w, b.h, on ? "#4fb0ff" : "#ffffff", 22); text(t === "planes" ? "✈️ Planes" : "🎨 Skins", b.x + b.w / 2, b.y + b.h / 2 + 1, 26, on ? "#fff" : "#1d3f6e"); }
  const sk = skin(), m = mdl();
  for (const c of shopCards()) {
    const isPlane = shopTab === "planes", it = c.it, own = (isPlane ? ownedModels : owned).includes(it.id), on = isPlane ? model === it.id : equipped === it.id;
    panel(c.x, c.y, c.w, c.h, on ? "#fff7d1" : "#ffffff", 22);
    if (on) { ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 6; roundRect(c.x, c.y, c.w, c.h, 22); ctx.stroke(); }
    const pm = isPlane ? it : m, ps = isPlane ? sk : it;
    const wid = (pm.L * 2 + 50) * pm.sc, fit = Math.min(isPlane ? 0.92 : 1.25, (c.w - 20) / wid);
    ctx.save(); ctx.translate(c.x + c.w / 2, c.y + (isPlane ? 150 : 128)); ctx.scale(fit, fit);
    drawPlane(-pm.L * pm.sc * 0.05, 0, 0, 1, ps, pm, time);
    ctx.restore();
    if (isPlane) {
      text(it.name, c.x + 24, c.y + 30, 28, "#1d3f6e", "left");
      text(it.about, c.x + 24, c.y + 172, 20, "#45607e", "left", null, c.w - 48);
      text(`🪙 x${it.coin} per landing`, c.x + c.w - 24, c.y + 30, 20, "#7a5200", "right");
    } else text(it.name, c.x + c.w / 2, c.y + 30, 22, "#1d3f6e", "center", null, c.w - 16);
    const by = c.y + c.h - 60, bw = c.w - 32;
    if (on) { panel(c.x + 16, by, bw, 46, "#ffcc00", 20); text("✔ EQUIPPED", c.x + c.w / 2, by + 24, 22, "#5a3a00"); }
    else if (own) { panel(c.x + 16, by, bw, 46, "#4fb0ff", 20); text("EQUIP", c.x + c.w / 2, by + 24, 24, "#fff"); }
    else { const can = coins >= it.price; panel(c.x + 16, by, bw, 46, can ? "#56d356" : "#c5cad3", 20); text((it.price ? "BUY 🪙 " + it.price : "FREE"), c.x + c.w / 2, by + 24, 22, can ? "#fff" : "#5d6470"); }
  }
  if (shopMsg) { panel(740, 96, 248, 48, "#ffe0e0", 22); text(shopMsg + " 🪙", 864, 121, 19, "#b02020", "center", null, 236); }
  for (const p of particles) { ctx.globalAlpha = clamp(p.life, 0, 1); circle(sx(p.x), sy(p.alt), p.r, p.c); }
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
function draw() {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#4fb0ff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
  drawScene();
  if (state === "play" || state === "crash" || state === "deliver") drawHud();
  if (state === "shop") drawShop();
}
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (state === "play" || state === "crash" || state === "deliver") update(dt);
  else {
    time += dt;
    for (const p of particles) { p.va -= p.g * dt; p.x += p.vx * dt; p.alt += p.va * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  draw();
  requestAnimationFrame(loop);
}
cv.addEventListener("pointerdown", e => {
  if (state === "shop") { e.preventDefault(); shopTap(toWorld(e)); return; }
  if (canShop()) { const p = toWorld(e); if (p.x > SHOPBTN.x && p.x < SHOPBTN.x + SHOPBTN.w && p.y > SHOPBTN.y && p.y < SHOPBTN.y + SHOPBTN.h) openShop("airport"); }
});
const startEl = document.getElementById("start");
function showStart() { startEl.style.display = "flex"; document.getElementById("startCoins").textContent = "🪙 " + coins + " coins   ⭐ " + totalStars; }
let audioReady = false;
function unlock() {
  if (audioReady) return; audioReady = true; initAudio();
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {}
}
let started = false;
document.getElementById("play").addEventListener("click", () => {
  unlock(); startEl.style.display = "none";
  if (!started) { started = true; parkAt(0); }
  state = "play"; sfx.ring();
  say(`Welcome, pilot! ${missionText()} Hold GO to speed up, then press UP to take off!`);
});
document.getElementById("shop").addEventListener("click", () => { unlock(); startEl.style.display = "none"; openShop("start"); });
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });
showStart();
requestAnimationFrame(loop);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
